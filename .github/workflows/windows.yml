name: windows

on:
  push:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build and test ${{matrix.build-type}} mode
    runs-on: windows-2022
    strategy:
      matrix:
        build-type: [Debug, Release]

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          repository: mimir/mimir
          path: mimir
          submodules: recursive

      - name: Clone mlir plugin
        uses: actions/checkout@v4
        with:
          path: mimir/extra/mlir

      - name: Install LIT
        shell: cmd
        run: python -m pip install lit psutil

      - name: Install FileCheck
        uses: i3h/download-release-asset@v1
        with:
          owner: fodinabor
          repo: FileCheckBuild
          tag: latest
          file: FileCheck-x86_64-win.exe
          path: mimir/bin
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set CC=cl.exe
          set CXX=cl.exe
          python -c "import sys; print(sys.executable)" > tmpPath
          set /p PYTHON_EXE= < tmpPath
          cmake -S mimir -B mimir/build -G Ninja   ^
                -DCMAKE_BUILD_TYPE=${{matrix.build-type}} ^
                -DBUILD_TESTING=ON                        ^
                -DMIM_BUILD_EXAMPLES=ON                   ^
                -DPython3_EXECUTABLE=%PYTHON_EXE%         ^
                -DPython_EXECUTABLE=%PYTHON_EXE%          ^
                -DPYTHON_EXECUTABLE=%PYTHON_EXE%          ^
                -DMIM_LIT_TIMEOUT=300                     ^
                -DMIM_FILECHECK=%cd%/mimir/bin/FileCheck-x86_64-win.exe

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: "21.1.8"

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build mimir/build -v
          
      - name: Reproduce with forward slashes
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          D:/a/mim_mlir/mim_mlir/mimir/build/bin/mim.exe -p opt D:/a/mim_mlir/mim_mlir/mimir/lit/tests/core/icmp.mim -o - | "D:/a/mim_mlir/mim_mlir/mimir/bin/FileCheck-x86_64-win.exe" D:/a/mim_mlir/mim_mlir/mimir/lit/tests/core/icmp.mim
          echo Exit code: %ERRORLEVEL%
          
      - name: Reproduce pipe failure manually
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          echo === Testing direct pipe ===
          D:\a\mim_mlir\mim_mlir\mimir\build\bin\mim.exe -p opt D:\a\mim_mlir\mim_mlir\mimir\lit\tests\core\icmp.mim -o - | "D:\a\mim_mlir\mim_mlir\mimir\bin\FileCheck-x86_64-win.exe" D:\a\mim_mlir\mim_mlir\mimir\lit\tests\core\icmp.mim
          echo Exit code: %ERRORLEVEL%

      - name: Test
        working-directory: mimir/build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set LIT_USE_INTERNAL_SHELL=1
          set PATH=%GITHUB_WORKSPACE%/mimir/bin;%PATH%
          cmake --build . -v --target test-all
